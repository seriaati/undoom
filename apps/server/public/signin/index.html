<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Undoom</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/signin/signin.js" defer></script>
</head>
<body>
  <main>
    <section id="signin">
      <h1>Undoom</h1>
      <p id="purpose">Sign in with your passkey.</p>
      <button id="login">Sign in with a passkey</button>
      <hr>
      <label for="name">New here? Name your account</label>
      <input id="name" maxlength="64" placeholder="e.g. Seria" autocomplete="nickname">
      <button id="register" class="secondary">Create an account</button>
    </section>
    <section id="add" hidden>
      <h1>Add a passkey</h1>
      <p>Create another passkey for your Undoom account, for example on a new device or password manager.</p>
      <button id="add-button">Add a passkey</button>
    </section>
    <section id="done" hidden>
      <h1>Done</h1>
      <p id="done-text">You're signed in. You can close this page.</p>
    </section>
    <p id="error" class="error" hidden></p>
  </main>
</body>
</html>
