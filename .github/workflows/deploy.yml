name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - apps/server/**
      - packages/engine/**
      - packages/catalog/**
      - pnpm-lock.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch:

# Never cancel a deploy halfway; queue the next one behind it.
concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        working-directory: apps/server
        run: pnpm test

      # Migrations go first so the new code never runs against an old schema.
      - name: Apply migrations and deploy
        working-directory: apps/server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm exec wrangler d1 migrations apply undoom --remote
          pnpm run deploy
