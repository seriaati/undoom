name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Queue runs so an older push can't overwrite the release of a newer one.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Passkeys are bound to the signing cert, so CI must sign with the same keystore as local releases.
      - name: Decode keystore
        env:
          UNDOOM_STORE_BASE64: ${{ secrets.UNDOOM_STORE_BASE64 }}
        run: echo "$UNDOOM_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        working-directory: apps/android
        env:
          ORG_GRADLE_PROJECT_UNDOOM_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_UNDOOM_STORE_PASSWORD: ${{ secrets.UNDOOM_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_UNDOOM_KEY_ALIAS: ${{ secrets.UNDOOM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_UNDOOM_KEY_PASSWORD: ${{ secrets.UNDOOM_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_UNDOOM_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew test assembleRelease

      # AMO refuses to sign a version twice, so each run appends its run number as a 4th version part.
      - name: Build extension
        run: |
          pnpm install --frozen-lockfile
          cd apps/extension
          npm pkg set version="$(npm pkg get version | tr -d '"').$GITHUB_RUN_NUMBER"
          pnpm test
          pnpm run zip

      # Unlisted (self-distributed) signing: AMO signs automatically without a public listing.
      # The bundle is minified, so AMO's policy requires the readable sources alongside it.
      - name: Sign extension
        working-directory: apps/extension/.output
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          pnpm dlx web-ext@10.8.0 sign --channel unlisted \
            --source-dir firefox-mv2 --artifacts-dir signed \
            --upload-source-code *-sources.zip

      # Fixed asset names keep /releases/latest/download/<name> pointing at the newest build.
      # updates.json is the Firefox update manifest that the extension's update_url points at.
      # Firefox rejects an update whose file doesn't match the listed version and hash, so a
      # check that lands between two uploads just fails and retries on the next check.
      # undoom-android.json is what the Android app's updater polls. It goes up after the APK so the
      # app never sees a new versionCode while the old APK is still being served.
      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk undoom.apk
          cp apps/extension/.output/signed/*.xpi undoom-firefox.xpi
          jq -n \
            --arg id "$(jq -r .browser_specific_settings.gecko.id apps/extension/.output/firefox-mv2/manifest.json)" \
            --arg version "$(jq -r .version apps/extension/.output/firefox-mv2/manifest.json)" \
            --arg link "https://github.com/$GITHUB_REPOSITORY/releases/download/latest/undoom-firefox.xpi" \
            --arg hash "sha256:$(sha256sum undoom-firefox.xpi | cut -d' ' -f1)" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link, update_hash: $hash}]}}}' > updates.json
          cat updates.json
          jq -n --argjson versionCode "$GITHUB_RUN_NUMBER" '{versionCode: $versionCode}' > undoom-android.json
          git tag -f latest
          git push -f origin refs/tags/latest
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Built automatically from the latest commit on main." --latest
          gh release upload latest undoom.apk undoom-firefox.xpi updates.json --clobber
          gh release upload latest undoom-android.json --clobber
