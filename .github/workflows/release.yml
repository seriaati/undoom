name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read version from tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Tag must look like v1.2.3"; exit 1; }
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          # Room for minor and patch up to 999 each while staying under Android's 2100000000 cap.
          echo "VERSION_CODE=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Passkeys are bound to the signing cert, so CI must sign with the same keystore as local releases.
      - name: Decode keystore
        env:
          UNDOOM_STORE_BASE64: ${{ secrets.UNDOOM_STORE_BASE64 }}
        run: echo "$UNDOOM_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        working-directory: apps/android
        env:
          ORG_GRADLE_PROJECT_UNDOOM_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_UNDOOM_STORE_PASSWORD: ${{ secrets.UNDOOM_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_UNDOOM_KEY_ALIAS: ${{ secrets.UNDOOM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_UNDOOM_KEY_PASSWORD: ${{ secrets.UNDOOM_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_UNDOOM_VERSION_CODE: ${{ env.VERSION_CODE }}
          ORG_GRADLE_PROJECT_UNDOOM_VERSION_NAME: ${{ env.VERSION }}
        run: ./gradlew test assembleRelease

      - name: Build extension
        run: |
          pnpm install --frozen-lockfile
          cd apps/extension
          npm pkg set version="$VERSION"
          pnpm test
          pnpm run zip

      # Unlisted (self-distributed) signing: AMO signs automatically without a public listing.
      # The bundle is minified, so AMO's policy requires the readable sources alongside it.
      - name: Sign extension
        working-directory: apps/extension/.output
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          pnpm dlx web-ext@10.8.0 sign --channel unlisted \
            --source-dir firefox-mv2 --artifacts-dir signed \
            --upload-source-code *-sources.zip

      # The extension's update_url and the Android updater read updates.json and undoom-android.json
      # through /releases/latest/download/, so they follow whichever release is marked Latest.
      # gh uploads the assets to a draft and publishes it after, so they all appear at once.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk undoom.apk
          cp apps/extension/.output/signed/*.xpi undoom-firefox.xpi
          jq -n \
            --arg id "$(jq -r .browser_specific_settings.gecko.id apps/extension/.output/firefox-mv2/manifest.json)" \
            --arg version "$VERSION" \
            --arg link "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/undoom-firefox.xpi" \
            --arg hash "sha256:$(sha256sum undoom-firefox.xpi | cut -d' ' -f1)" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link, update_hash: $hash}]}}}' > updates.json
          cat updates.json
          jq -n --argjson versionCode "$VERSION_CODE" '{versionCode: $versionCode}' > undoom-android.json
          gh release create "$GITHUB_REF_NAME" undoom.apk undoom-firefox.xpi updates.json undoom-android.json --generate-notes
