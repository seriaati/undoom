name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # Passkeys are bound to the signing cert, so CI must sign with the same keystore as local releases.
      - name: Decode keystore
        env:
          UNDOOM_STORE_BASE64: ${{ secrets.UNDOOM_STORE_BASE64 }}
        run: echo "$UNDOOM_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        working-directory: apps/android
        env:
          ORG_GRADLE_PROJECT_UNDOOM_STORE_FILE: ${{ runner.temp }}/release.jks
          ORG_GRADLE_PROJECT_UNDOOM_STORE_PASSWORD: ${{ secrets.UNDOOM_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_UNDOOM_KEY_ALIAS: ${{ secrets.UNDOOM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_UNDOOM_KEY_PASSWORD: ${{ secrets.UNDOOM_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease

      - name: Build extension
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @undoom/extension test
          pnpm --filter @undoom/extension zip

      # Unlisted (self-distributed) signing: AMO signs automatically without a public listing.
      # The bundle is minified, so AMO's policy requires the readable sources alongside it.
      - name: Sign extension
        working-directory: apps/extension/.output
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          pnpm dlx web-ext@10.8.0 sign --channel unlisted \
            --source-dir firefox-mv2 --artifacts-dir signed \
            --upload-source-code *-sources.zip

      # Fixed asset names keep /releases/latest/download/<name> pointing at the newest build.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/android/app/build/outputs/apk/release/app-release.apk undoom.apk
          cp apps/extension/.output/signed/*.xpi undoom-firefox.xpi
          gh release create "$GITHUB_REF_NAME" undoom.apk undoom-firefox.xpi --generate-notes
